<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Placement Preparation Generator</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f4f6f8;
    display:flex;
    justify-content:center;
    padding:30px;
}
.card{
    background:#ffffff;
    width:480px;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 12px rgba(0,0,0,0.15);
}
.top-name{
    text-align:center;
    font-size:14px;
    font-weight:bold;
    color:#444;
    margin-bottom:5px;
}
h2{
    text-align:center;
    margin:5px 0 15px;
}
label{
    font-weight:bold;
    display:block;
    margin-top:10px;
}
input, select, button{
    width:100%;
    padding:8px;
    margin-top:5px;
    box-sizing:border-box;
}
button{
    background:#1976d2;
    color:#fff;
    border:none;
    margin-top:15px;
    font-size:15px;
    cursor:pointer;
}
button:hover{
    background:#125aa0;
}
.output{
    margin-top:20px;
    max-height:380px;
    overflow-y:auto;
}
.month{
    background:#eef3ff;
    padding:10px;
    margin-bottom:10px;
    border-radius:6px;
    font-size:14px;
}
.credit{
    text-align:center;
    font-size:11px;
    color:gray;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="card">

    <div class="top-name">@santhoshKumar</div>
    <h2>Placement Preparation Generator</h2>

    <label>Preparation Level</label>
    <select id="level">
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
    </select>

    <label>Company Type</label>
    <select id="company">
        <option value="service">Service Based Company</option>
        <option value="product">Product Based Company</option>
    </select>

    <label>Enter months remain</label>
    <input type="number" id="months" placeholder="1 to 48" min="1" max="48">

    <button onclick="generatePlan()">Generate Monthly Plan</button>

    <div class="output" id="output"></div>

    <div class="credit">@santhoshKumar</div>

</div>

<script>
function generatePlan(){
    const months = parseInt(document.getElementById("months").value);
    const level = document.getElementById("level").value;
    const company = document.getElementById("company").value;
    const output = document.getElementById("output");

    output.innerHTML = "";

    if(isNaN(months) || months < 1 || months > 48){
        output.innerHTML = "<p>Please enter a valid number of months (1–48).</p>";
        return;
    }

    const monthThemes = [
        "Concept Building",
        "Practice & Accuracy",
        "Speed & Problem Solving",
        "Mock Tests & Revision"
    ];

    for(let i = 1; i <= months; i++){
        const theme = monthThemes[(i - 1) % 4];
        let plan = "";

        // LEVEL DIFFERENCE
        if(level === "beginner"){
            if(theme === "Concept Building")
                plan += "Learn basic syntax, variables, loops<br>";
            else if(theme === "Practice & Accuracy")
                plan += "Solve easy programming problems<br>";
            else if(theme === "Speed & Problem Solving")
                plan += "Timed practice of basic questions<br>";
            else
                plan += "Revise fundamentals & clear doubts<br>";
        }
        else if(level === "intermediate"){
            if(theme === "Concept Building")
                plan += "Learn Stack, Queue, Linked List<br>";
            else if(theme === "Practice & Accuracy")
                plan += "Solve medium-level DSA problems<br>";
            else if(theme === "Speed & Problem Solving")
                plan += "Improve speed with constraints<br>";
            else
                plan += "Take mocks & analyze weak areas<br>";
        }
        else{
            if(theme === "Concept Building")
                plan += "Advanced DSA: Trees, Graphs, DP<br>";
            else if(theme === "Practice & Accuracy")
                plan += "Solve interview-level problems<br>";
            else if(theme === "Speed & Problem Solving")
                plan += "Optimize solutions (time & space)<br>";
            else
                plan += "Full mock interviews & revision<br>";
        }

        // COMPANY DIFFERENCE
        if(company === "service"){
            plan += "Aptitude & reasoning practice<br>";
            plan += "HR & behavioral questions<br>";
        } else {
            plan += "LeetCode / Codeforces problems<br>";
            plan += "System design basics<br>";
        }

        output.innerHTML += `
        <div class="month">
            <b>Month ${i}</b><br>
            <b>Theme:</b> ${theme}<br>
            ${plan}
        </div>`;
    }
}
</script>

</body>
</html>
